[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "receipt-gen"
version = "1.0.0"
description = "Generate Japanese receipt PDFs from a local JSON file."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Jinja2>=3.1",
    "WeasyPrint>=62",
]

[project.scripts]
receipt-gen = "receipt_gen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
receipt_gen = ["templates/*.html", "templates/*.css"]

[tool.pytest.ini_options]
pythonpath = ["src"]
